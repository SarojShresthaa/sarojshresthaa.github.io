services:
  - type: web
    name: luffy-cms-oauth
    runtime: node
    rootDir: oauth-proxy
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: OAUTH_GITHUB_CLIENT_ID
        value: Ov23lii35wclPrYpEXGo
      - key: OAUTH_GITHUB_CLIENT_SECRET
        sync: false
