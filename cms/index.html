<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portfolio CMS (Umbraco 17–inspired)</title>
  <link rel="stylesheet" href="/cms/css/backoffice.css" />
</head>
<body>
  <div class="bo-app" id="bo-app">
    <nav class="bo-rail" aria-label="Sections">
      <button type="button" class="bo-rail-btn active" data-section="content" title="Content">📄</button>
      <button type="button" class="bo-rail-btn" data-section="media" title="Media">🖼</button>
      <button type="button" class="bo-rail-btn" data-section="settings" title="Settings">⚙</button>
      <a class="bo-rail-btn" href="/" title="View site" style="text-decoration:none;margin-top:auto">↗</a>
    </nav>
    <aside class="bo-tree-panel" id="bo-tree"></aside>
    <div class="bo-main">
      <header class="bo-topbar">
        <div class="bo-brand"><strong>Portfolio CMS</strong> · Umbraco 17–inspired · not official Umbraco</div>
        <div class="bo-toolbar">
          <span class="bo-status-pill" id="bo-status-pill"></span>
          <span id="bo-auth-label" style="font-size:12px;color:var(--bo-muted)"></span>
          <button type="button" class="bo-btn" id="btn-cms-lock" title="Lock CMS (username/password)">Lock</button>
          <button type="button" class="bo-btn" id="btn-login">Sign in with GitHub</button>
          <button type="button" class="bo-btn" id="btn-logout" style="display:none">GitHub sign out</button>
          <button type="button" class="bo-btn" id="btn-new-project">New project</button>
          <button type="button" class="bo-btn" id="btn-preview">Preview</button>
          <button type="button" class="bo-btn" id="btn-save" disabled>Save</button>
          <button type="button" class="bo-btn primary" id="btn-publish" disabled>Publish</button>
          <button type="button" class="bo-btn danger" id="btn-delete" style="display:none">Delete</button>
        </div>
      </header>
      <div class="bo-breadcrumb" id="bo-breadcrumb">Content</div>
      <div class="bo-tabs" role="tablist">
        <button type="button" class="bo-tab active" role="tab">Content</button>
        <button type="button" class="bo-tab" role="tab" disabled title="Info panel placeholder">Info</button>
      </div>
      <div class="bo-editor-wrap" id="bo-editor"></div>
    </div>
  </div>

  <script type="module" src="/cms/js/app.js?v=2"></script>
</body>
</html>
