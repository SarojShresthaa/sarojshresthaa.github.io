<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saroj Shrestha – Umbraco & .NET Developer</title>
  <meta name="description" content="Saroj Shrestha, Umbraco and .NET developer at ZAAKS! in Kathmandu." />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved;
      if (!theme && window.matchMedia) {
        theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme || "dark");
    })();
  </script>
</head>
<body data-page="home">
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <span class="logo-mark" aria-hidden="true"></span>
        <span data-site-name>saroj.dev</span>
      </a>
      <div class="menu-cont">
        <button class="menu-btn" type="button" aria-label="Open menu">
          <span></span>
          <span></span>
        </button>
        <ul class="menubar" data-portfolio-nav-root>
          <li data-portfolio-nav-insert>
            <button class="soc theme-btn" type="button" aria-label="Toggle light and dark mode">
              <svg class="icon-lamp-off" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 21h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1Zm3-19a7 7 0 0 0-4 12.6V17h8v-2.4A7 7 0 0 0 12 2Z"/>
              </svg>
              <svg class="icon-lamp-on" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 21h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1Zm3-19a7 7 0 0 0-4 12.6V17h8v-2.4A7 7 0 0 0 12 2Z"/>
              </svg>
            </button>
          </li>
          <div class="social-rail animate-bounce-slower" data-social-rail></div>
        </ul>
      </div>
    </div>
  </header>

  <main class="container page">
    <section class="hero" data-home-hero></section>
    <div class="quote-wrap" data-home-quote></div>
    <section class="section about-snippet">
      <div class="about-snippet-inner" data-home-about></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2 class="section-heading after">projects</h2>
        <a class="view-all" href="/projects">See all →</a>
      </div>
      <div class="projects-grid" data-home-projects></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2 class="section-heading after">skills</h2>
      </div>
      <div data-home-skills></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2 class="section-heading after">contact</h2>
      </div>
      <div class="contact-grid">
        <p class="lead" data-home-contact-lead></p>
        <div class="contact-box" data-home-contact-box></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="footer-top">
          <a class="logo" href="/">
            <span class="logo-mark" aria-hidden="true"></span>
            <span data-site-name>saroj.dev</span>
          </a>
        </div>
        <p data-footer-blurb></p>
      </div>
      <div class="footer-media">
        <h3>Media</h3>
        <ul class="media-links" data-footer-social></ul>
      </div>
    </div>
    <p class="copyright" data-copyright></p>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/portfolio.js"></script>
</body>
</html>
